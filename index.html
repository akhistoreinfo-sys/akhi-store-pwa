<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>AKHI STORE</title>

  <meta
    name="theme-color"
    content="#002361"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./akhi-store-icon-192.png"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000050;
      font-family: Arial, sans-serif;
    }

    .launch-screen {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000050;
      text-align: center;
      color: #ffffff;
    }

    .app-icon {
      width: 128px;
      height: 128px;
      border-radius: 28px;
    }

    .app-name {
      margin-top: 18px;
      font-size: 24px;
      font-weight: 700;
    }

    .status {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.8;
    }

    .suite-frame {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .launch-screen.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div
    class="launch-screen"
    id="launchScreen"
  >
    <div>
      <img
        class="app-icon"
        src="./akhi-store-icon-192.png"
        alt="AKHI STORE"
      >

      <div class="app-name">
        AKHI STORE
      </div>

      <div class="status">
        Business Suite
      </div>
    </div>
  </div>

  <iframe
    class="suite-frame"
    id="suiteFrame"
    title="AKHI STORE BUSINESS SUITE"
  ></iframe>

  <script>
    const BUSINESS_SUITE_URL =
      "https://script.google.com/macros/s/AKfycbybv_QJeVVMQ4CK1jwP15PVgR8TDeI-VHVSDT6GS5WzvBMSTiLKb8oL_mNmxPp2f6Zn/exec";

    const launchScreen =
      document.getElementById("launchScreen");

    const suiteFrame =
      document.getElementById("suiteFrame");

    function launchBusinessSuite() {
      if (!navigator.onLine) {
        return;
      }

      suiteFrame.addEventListener(
        "load",
        function () {
          launchScreen.classList.add("hidden");
        },
        { once: true }
      );

      suiteFrame.src = BUSINESS_SUITE_URL;
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener(
        "load",
        function () {
          navigator.serviceWorker.register(
            "./service-worker.js"
          );
        }
      );
    }

    window.addEventListener(
      "load",
      launchBusinessSuite
    );

    window.addEventListener(
      "online",
      function () {
        if (!suiteFrame.src) {
          launchBusinessSuite();
        }
      }
    );
  </script>

</body>
</html>
